site_name: NGINX Wiki
site_description: Community documentation for NGINX configuration, architecture, and module development. Learn NGINX internals, C APIs, module development, and production-ready configuration patterns.
site_url: https://nginx-wiki.getpagespeed.com/
site_author: NGINX Community
copyright: Copyright &copy; 2024-2025 NGINX Wiki Contributors

# SEO and Social
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GetPageSpeed/nginx-wiki
      name: NGINX Wiki on GitHub
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  meta:
    - name: keywords
      content: nginx, nginx configuration, nginx tutorial, web server, reverse proxy, load balancer, nginx modules, nginx development, nginx c api, nginx architecture
    - name: author
      content: NGINX Community
    - name: robots
      content: index, follow
    - property: og:type
      content: website
    - property: og:site_name
      content: NGINX Wiki
    - property: og:locale
      content: en_US
    - name: twitter:card
      content: summary_large_image
    - name: twitter:site
      content: "@nginx"

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/images/logo.svg
  favicon: assets/images/nginx-favicon.png
  icon:
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
      toc_depth: 4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - meta
  - tags
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
      docs_structure: suffix

extra_css:
  - assets/stylesheets/extra.css

